<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'none'">
  <title>Admin — Pele Awakening</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=20261114c">
  <link rel="stylesheet" href="/admin/admin.css?v=20261114c">
</head>
<body class="admin">
  <header class="admin-header">
    <div class="admin-brand"><img src="/images/pele-logo.png" alt=""><span>Pele Awakening Admin</span></div>
    <div class="admin-user" id="adminUser" hidden>
      <span id="adminEmail"></span>
      <button type="button" class="admin-btn admin-btn--ghost" id="signOut">Sign out</button>
    </div>
  </header>

  <main class="admin-main">
    <section id="loginView" class="admin-login" hidden>
      <h1>Sign in</h1>
      <p>Enter your admin email and we&rsquo;ll send you a sign-in link.</p>
      <form id="loginForm">
        <input class="form-input" type="email" id="loginEmail" autocomplete="email" required placeholder="you@peleawakening.com">
        <button type="submit" class="admin-btn">Send sign-in link</button>
      </form>
      <p class="admin-msg" id="loginMsg" role="status"></p>
    </section>

    <section id="appView" hidden>
      <nav class="admin-tabs" id="adminTabs" role="tablist">
        <button type="button" data-tab="bookings" class="is-active">Bookings</button>
        <button type="button" data-tab="schedule">Schedule</button>
        <button type="button" data-tab="classes">Classes &amp; Prices</button>
        <button type="button" data-tab="customers">Customers</button>
        <button type="button" data-tab="payments">Payments</button>
        <button type="button" data-tab="inquiries">Inquiries</button>
        <button type="button" data-tab="settings">Settings</button>
      </nav>
      <div id="tabContent" class="admin-content"></div>
    </section>

    <p class="admin-msg" id="setupMsg" hidden>Booking backend is not configured yet. Add the Supabase URL and anon key to <code>/js/pa-config.js</code>.</p>
  </main>

  <div class="admin-toast" id="toast" role="status" hidden></div>

  <script src="/js/pa-config.js?v=20261114c"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
  <script src="/admin/admin.js?v=20261114c"></script>
</body>
</html>
