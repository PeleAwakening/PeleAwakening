# Blocks commits that contain Stripe secret keys or Supabase service-role keys.
name: Secret scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for server-side secrets
        run: |
          set -e
          if grep -rInE --exclude-dir=.git --exclude=secret-scan.yml \
              '(sk|rk)_(live|test)_[0-9A-Za-z]{10,}|whsec_[0-9A-Za-z]{10,}|sb_secret_[0-9A-Za-z_-]{10,}|"role"\s*:\s*"service_role"' . ; then
            echo "::error::Secret key found in repository. Remove it and rotate the key."
            exit 1
          fi
          # Supabase legacy JWT keys: reject any committed JWT whose payload says service_role.
          for jwt in $(grep -rhoE --exclude-dir=.git 'eyJ[0-9A-Za-z_-]+\.eyJ[0-9A-Za-z_-]+\.[0-9A-Za-z_-]+' . | sort -u); do
            payload=$(echo "$jwt" | cut -d. -f2 | tr '_-' '/+')
            while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
            if echo "$payload" | base64 -d 2>/dev/null | grep -q '"service_role"'; then
              echo "::error::Supabase service-role key found in repository. Remove it and rotate the key."
              exit 1
            fi
          done
          echo "No secrets found."
